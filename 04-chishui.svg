<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="1935年1月至3月，红军四次渡过赤水河，忽东忽西掌握战场主动权">
  <title>四渡赤水</title>
  <defs>
    <linearGradient id="cpaper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f7f0e2"/><stop offset="1" stop-color="#e6d8c2"/>
    </linearGradient>
    <linearGradient id="criver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fa6"/><stop offset="1" stop-color="#1d4a68"/>
    </linearGradient>
    <style>
      @keyframes dash{to{stroke-dashoffset:-42}}
      @keyframes pulse2{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
      @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-5px)}}
      .route{stroke-dasharray:9 7;animation:dash 2.6s linear infinite}
      .r2{animation-delay:.35s}.r3{animation-delay:.7s}.r4{animation-delay:1.05s}
      .pin{animation:pulse2 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pin2{animation-delay:.6s}.pin3{animation-delay:1.2s}.pin4{animation-delay:1.8s}
      .boat3{animation:float2 6s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="640" height="360" fill="url(#cpaper)"/>
  <!-- 底纹网格（军用地图感） -->
  <g stroke="#c9b79a" stroke-width="1" opacity="0.5">
    <path d="M0 60 H640 M0 120 H640 M0 180 H640 M0 240 H640 M0 300 H640"/>
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360"/>
  </g>
  <!-- 等高线装饰 -->
  <g stroke="#d8c7ab" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M60 96 q54 -30 108 0 t108 0"/>
    <path d="M420 300 q54 -28 108 0"/>
  </g>

  <!-- 赤水河：蜿蜒自北向南 -->
  <path d="M300 0 C268 46 350 74 316 118 C286 156 356 178 322 216 C292 250 348 276 316 316 C300 336 306 348 310 360"
        fill="none" stroke="url(#criver)" stroke-width="26" stroke-linecap="round" opacity="0.92"/>
  <path d="M300 0 C268 46 350 74 316 118 C286 156 356 178 322 216 C292 250 348 276 316 316 C300 336 306 348 310 360"
        fill="none" stroke="#8fc7e0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 四次渡河的路线：忽东忽西 -->
  <g fill="none" stroke="#c8342b" stroke-width="3.6" stroke-linecap="round">
    <path class="route" d="M208 128 Q262 138 300 148"/>
    <path class="route r2" d="M300 152 Q336 132 388 126"/>
    <path class="route r3" d="M300 214 Q250 228 196 236"/>
    <path class="route r4" d="M300 220 Q352 236 402 246"/>
  </g>

  <!-- 渡口标记 -->
  <g>
    <g class="pin"><circle cx="300" cy="146" r="8" fill="#c8342b" opacity="0.85"/><circle cx="300" cy="146" r="3.4" fill="#fff3e0"/></g>
    <g class="pin pin2"><circle cx="300" cy="156" r="8" fill="#c8342b" opacity="0.85"/><circle cx="300" cy="156" r="3.4" fill="#fff3e0"/></g>
    <g class="pin pin3"><circle cx="300" cy="212" r="8" fill="#c8342b" opacity="0.85"/><circle cx="300" cy="212" r="3.4" fill="#fff3e0"/></g>
    <g class="pin pin4"><circle cx="300" cy="224" r="8" fill="#c8342b" opacity="0.85"/><circle cx="300" cy="224" r="3.4" fill="#fff3e0"/></g>
  </g>

  <!-- 渡河的小船 -->
  <g class="boat3">
    <path d="M288 140 q12 8 24 0 l-4 8 q-8 5 -16 0 z" fill="#5a3a22"/>
  </g>
  <g class="boat3" style="animation-delay:1.4s">
    <path d="M290 206 q12 8 24 0 l-4 8 q-8 5 -16 0 z" fill="#5a3a22"/>
  </g>

  <!-- 序号标注 -->
  <g font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#8c1616">
    <text x="176" y="124">一渡</text>
    <text x="400" y="120">二渡</text>
    <text x="152" y="252">三渡</text>
    <text x="414" y="262">四渡</text>
  </g>
  <g font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#6b6f76">
    <text x="326" y="52">赤水河</text>
    <text x="60" y="336">川黔滇边界 · 1935年1—3月</text>
  </g>

  <!-- 指北针 -->
  <g transform="translate(586,54)">
    <circle r="17" fill="none" stroke="#8c1616" stroke-width="1.6" opacity="0.8"/>
    <path d="M0 -12 L5 4 L0 1 L-5 4 Z" fill="#8c1616"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#8c1616">N</text>
  </g>
</svg>
