<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="1935年6月至9月，红军翻越夹金山、穿越松潘草地北上">
  <title>翻雪山，过草地</title>
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2632"/><stop offset="0.5" stop-color="#43536a"/><stop offset="1" stop-color="#8d9cae"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c8da"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a6e"/><stop offset="1" stop-color="#26313f"/>
    </linearGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5340"/><stop offset="1" stop-color="#22271d"/>
    </linearGradient>
    <style>
      @keyframes snowfall{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(-40px,180px);opacity:0}}
      @keyframes mist{0%,100%{transform:translateX(0);opacity:.28}50%{transform:translateX(26px);opacity:.5}}
      .f1{animation:snowfall 6s linear infinite}
      .f2{animation:snowfall 7.5s linear infinite 1.6s}
      .f3{animation:snowfall 5.4s linear infinite 3.1s}
      .f4{animation:snowfall 8.2s linear infinite .8s}
      .f5{animation:snowfall 6.8s linear infinite 4.2s}
      .f6{animation:snowfall 7.1s linear infinite 2.4s}
      .mist{animation:mist 9s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="640" height="360" fill="url(#ssky)"/>
  <path d="M0 150 L92 96 L150 140 L236 78 L330 148 L410 104 L500 152 L580 116 L640 156 L640 200 L0 200 Z" fill="#5b6c82" opacity="0.75"/>
  <path d="M0 176 L110 126 L196 172 L300 118 L396 176 L492 134 L640 180 L640 216 L0 216 Z" fill="#3d4c60"/>

  <!-- 主峰：夹金山 -->
  <path d="M118 214 L268 62 L418 214 Z" fill="url(#rock)"/>
  <path d="M268 62 L318 112 L296 118 L336 152 L300 160 L340 198 L268 198 L200 162 L232 154 L196 120 L232 114 Z" fill="url(#snow)"/>
  <path d="M268 62 L268 198" stroke="#e7eef7" stroke-width="1.2" opacity="0.5"/>

  <!-- 右侧次峰 -->
  <path d="M400 214 L508 110 L616 214 Z" fill="url(#rock)"/>
  <path d="M508 110 L538 146 L514 152 L546 186 L508 186 L470 152 L500 146 Z" fill="url(#snow)"/>

  <!-- 雪线 -->
  <path d="M0 214 Q120 202 240 212 T480 208 T640 214 L640 230 L0 230 Z" fill="#dbe6f0" opacity="0.85"/>

  <!-- 草地 -->
  <rect y="228" width="640" height="132" fill="url(#grassG)"/>
  <g stroke="#6d7a56" stroke-width="1.6" fill="none" opacity="0.65">
    <path d="M40 262 q6 -18 12 0"/><path d="M96 276 q6 -20 12 0"/><path d="M158 268 q6 -16 12 0"/>
    <path d="M232 288 q6 -20 12 0"/><path d="M300 274 q6 -18 12 0"/><path d="M372 290 q6 -22 12 0"/>
    <path d="M446 278 q6 -18 12 0"/><path d="M520 292 q6 -20 12 0"/><path d="M590 276 q6 -18 12 0"/>
  </g>
  <!-- 水洼（沼泽） -->
  <g fill="#5c6f78" opacity="0.55">
    <ellipse cx="200" cy="316" rx="46" ry="9"/><ellipse cx="410" cy="332" rx="56" ry="10"/>
    <ellipse cx="540" cy="308" rx="34" ry="7"/>
  </g>
  <!-- 草地雾气 -->
  <ellipse class="mist" cx="300" cy="300" rx="220" ry="26" fill="#c9d4de" opacity="0.3"/>
  <ellipse class="mist" cx="520" cy="326" rx="150" ry="20" fill="#c9d4de" opacity="0.24" style="animation-delay:2s"/>

  <!-- 行军的队伍剪影：由近及远 -->
  <g fill="#0e1319">
    <g>
      <circle cx="96" cy="272" r="7"/><rect x="87" y="279" width="18" height="34" rx="5"/>
      <rect x="90" y="313" width="5" height="22"/><rect x="99" y="313" width="5" height="22"/>
      <path d="M105 282 L120 306" stroke="#0e1319" stroke-width="3"/>
    </g>
    <g>
      <circle cx="140" cy="282" r="6.4"/><rect x="132" y="288" width="16" height="30" rx="5"/>
      <rect x="135" y="318" width="4.6" height="20"/><rect x="143" y="318" width="4.6" height="20"/>
    </g>
    <g opacity="0.9">
      <circle cx="182" cy="290" r="5.6"/><rect x="175" y="295" width="14" height="26" rx="4"/>
      <rect x="178" y="321" width="4" height="18"/><rect x="185" y="321" width="4" height="18"/>
    </g>
    <g opacity="0.75">
      <circle cx="218" cy="296" r="4.8"/><rect x="212" y="300" width="12" height="22" rx="4"/>
    </g>
    <g opacity="0.6">
      <circle cx="248" cy="300" r="4"/><rect x="243" y="304" width="10" height="18" rx="3"/>
    </g>
    <!-- 队首的军旗 -->
    <rect x="112" y="248" width="2" height="52" fill="#2a2018"/>
    <path d="M114 250 l22 6 -22 6 z" fill="#c8342b"/>
  </g>
  <ellipse cx="120" cy="338" rx="130" ry="8" fill="#12170f" opacity="0.5"/>

  <!-- 风雪 -->
  <g fill="#ffffff">
    <circle class="f1" cx="120" cy="30" r="2.2"/><circle class="f2" cx="248" cy="16" r="1.8"/>
    <circle class="f3" cx="360" cy="44" r="2"/><circle class="f4" cx="470" cy="24" r="1.9"/>
    <circle class="f5" cx="560" cy="60" r="2.1"/><circle class="f6" cx="196" cy="76" r="1.7"/>
    <circle class="f2" cx="316" cy="88" r="1.6"/><circle class="f4" cx="596" cy="102" r="1.8"/>
    <circle class="f1" cx="66" cy="118" r="1.6"/><circle class="f5" cx="410" cy="126" r="1.7"/>
  </g>
</svg>
