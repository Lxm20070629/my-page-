<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="1934年10月，中央红军于都河畔夜渡出发">
  <title>于都河畔，出发</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08131f"/><stop offset="0.55" stop-color="#122b3d"/><stop offset="1" stop-color="#2b3a3c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a49"/><stop offset="1" stop-color="#0a1a23"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#ffe9b8" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <style>
      @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes row{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
      .star{animation:twinkle 3.4s ease-in-out infinite}
      .s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.4s}
      .boat{animation:row 7s ease-in-out infinite}
      .boat2{animation:bob 4.5s ease-in-out infinite}
      .lamp{animation:twinkle 2.2s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="492" cy="76" r="96" fill="url(#moonGlow)"/>
  <circle cx="492" cy="76" r="26" fill="#ffeec2" opacity="0.92"/>
  <circle cx="482" cy="68" r="4" fill="#ffe0a0" opacity="0.5"/>
  <circle cx="502" cy="86" r="3" fill="#ffe0a0" opacity="0.4"/>

  <g fill="#fff6da">
    <circle class="star" cx="76" cy="52" r="1.8"/><circle class="star s2" cx="158" cy="34" r="1.4"/>
    <circle class="star s3" cx="246" cy="66" r="1.6"/><circle class="star s4" cx="330" cy="40" r="1.3"/>
    <circle class="star s2" cx="412" cy="58" r="1.5"/><circle class="star s3" cx="566" cy="44" r="1.4"/>
    <circle class="star s4" cx="116" cy="96" r="1.2"/><circle class="star" cx="608" cy="104" r="1.3"/>
  </g>

  <!-- 远山 -->
  <path d="M0 168 L92 120 L168 166 L250 128 L338 170 L430 134 L520 174 L640 140 L640 200 L0 200 Z" fill="#0d2030"/>
  <!-- 对岸村庄的灯火 -->
  <g>
    <rect x="70" y="182" width="26" height="16" fill="#0a1620"/>
    <rect x="104" y="186" width="20" height="12" fill="#0a1620"/>
    <rect x="152" y="180" width="30" height="18" fill="#0a1620"/>
    <rect x="78" y="187" width="5" height="4" fill="#ffc46b" opacity="0.9"/>
    <rect x="110" y="190" width="4" height="3" fill="#ffc46b" opacity="0.8"/>
    <rect x="162" y="186" width="5" height="4" fill="#ffc46b" opacity="0.85"/>
  </g>

  <!-- 江水 -->
  <rect y="200" width="640" height="160" fill="url(#water)"/>
  <g stroke="#5f8fa6" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 224 Q60 216 120 224 T240 224 T360 224 T480 224 T600 224 T720 224"/>
    <path d="M0 254 Q70 246 140 254 T280 254 T420 254 T560 254 T700 254"/>
    <path d="M0 292 Q80 284 160 292 T320 292 T480 292 T640 292"/>
  </g>
  <g stroke="#8fc4d8" stroke-width="1.4" fill="none" opacity="0.35">
    <path d="M0 240 Q60 234 120 240 T240 240 T360 240 T480 240 T600 240"/>
  </g>

  <!-- 浮桥 -->
  <g>
    <rect x="0" y="236" width="640" height="7" fill="#4a382c"/>
    <g fill="#3a2c22">
      <rect x="34" y="243" width="16" height="26" rx="3"/><rect x="118" y="243" width="16" height="26" rx="3"/>
      <rect x="206" y="243" width="16" height="26" rx="3"/><rect x="300" y="243" width="16" height="26" rx="3"/>
      <rect x="398" y="243" width="16" height="26" rx="3"/><rect x="494" y="243" width="16" height="26" rx="3"/>
      <rect x="586" y="243" width="16" height="26" rx="3"/>
    </g>
  </g>

  <!-- 渡河的小船 -->
  <g class="boat">
    <g class="boat2">
      <path d="M436 286 q34 15 70 0 l-9 13 q-26 10 -52 0 z" fill="#2a1d16"/>
      <g fill="#1a1410">
        <rect x="446" y="266" width="5" height="20" rx="2"/>
        <rect x="456" y="262" width="5" height="24" rx="2"/>
        <rect x="466" y="264" width="5" height="22" rx="2"/>
        <rect x="476" y="268" width="5" height="18" rx="2"/>
        <circle cx="448.5" cy="262" r="4"/><circle cx="458.5" cy="258" r="4"/>
        <circle cx="468.5" cy="260" r="4"/><circle cx="478.5" cy="264" r="4"/>
      </g>
      <rect x="486" y="252" width="2" height="34" fill="#5a4636"/>
      <path d="M488 254 l20 7 -20 7 z" fill="#c8342b"/>
    </g>
  </g>
  <ellipse cx="470" cy="302" rx="44" ry="4" fill="#0b1a22" opacity="0.6"/>

  <!-- 岸边送行的灯火与队伍 -->
  <g>
    <path d="M0 300 L88 276 L176 302 L176 360 L0 360 Z" fill="#16222a"/>
    <g fill="#0f1a21">
      <circle cx="112" cy="272" r="5"/><rect x="106" y="276" width="12" height="22" rx="4"/>
      <circle cx="132" cy="276" r="5"/><rect x="126" y="280" width="12" height="20" rx="4"/>
      <circle cx="152" cy="280" r="5"/><rect x="146" y="284" width="12" height="18" rx="4"/>
    </g>
    <g>
      <circle cx="112" cy="262" r="14" fill="url(#lampGlow)" class="lamp"/>
      <circle cx="112" cy="264" r="3" fill="#ffd08a" class="lamp"/>
    </g>
  </g>
</svg>
