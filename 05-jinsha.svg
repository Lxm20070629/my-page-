<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="1935年5月，红军巧渡金沙江、强渡大渡河、飞夺泸定桥">
  <title>巧渡金沙江 · 强渡大渡河 · 飞夺泸定桥</title>
  <defs>
    <linearGradient id="jsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1622"/><stop offset="0.55" stop-color="#22374a"/><stop offset="1" stop-color="#4a5c66"/>
    </linearGradient>
    <linearGradient id="jwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6f7a"/><stop offset="0.35" stop-color="#33505f"/><stop offset="1" stop-color="#11212c"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#12161c"/>
    </linearGradient>
    <radialGradient id="jmoon"><stop offset="0" stop-color="#ffe6b0" stop-opacity="0.6"/><stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/></radialGradient>
    <linearGradient id="moonPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a6" stop-opacity="0.75"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      @keyframes jflow{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
      @keyframes jcross{0%{transform:translateX(0)}100%{transform:translateX(150px)}}
      @keyframes jbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes glint{0%,100%{opacity:.35}50%{opacity:.9}}
      .jflow{animation:jflow 6.5s ease-in-out infinite}
      .jflow2{animation:jflow 8s ease-in-out infinite reverse}
      .jcross{animation:jcross 9s linear infinite}
      .jbob{animation:jbob 4.2s ease-in-out infinite}
      .glint{animation:glint 3s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="640" height="360" fill="url(#jsky)"/>
  <circle cx="330" cy="66" r="86" fill="url(#jmoon)"/>
  <circle cx="330" cy="66" r="22" fill="#fff0cd" opacity="0.9"/>
  <g fill="#e8f1ff" opacity="0.5">
    <circle cx="92" cy="46" r="1.4"/><circle cx="198" cy="32" r="1.2"/><circle cx="470" cy="52" r="1.5"/>
    <circle cx="560" cy="34" r="1.2"/>
  </g>

  <!-- 两岸峭壁 -->
  <path d="M0 120 L86 96 L140 150 L196 122 L232 190 L232 360 L0 360 Z" fill="url(#cliff)"/>
  <path d="M640 108 L556 84 L498 142 L444 112 L410 196 L410 360 L640 360 Z" fill="url(#cliff)"/>
  <!-- 崖壁纹理 -->
  <g stroke="#3d4653" stroke-width="1.4" fill="none" opacity="0.7">
    <path d="M40 170 L100 210 M20 240 L86 276 M580 160 L520 206 M604 236 L544 272"/>
  </g>

  <!-- 江面 -->
  <rect y="212" width="640" height="148" fill="url(#jwater)"/>
  <!-- 月光在水面的反光带 -->
  <path d="M318 212 L342 212 L372 360 L288 360 Z" fill="url(#moonPath)" class="glint"/>
  <g class="jflow" stroke="#a9ccdd" stroke-width="2" fill="none" opacity="0.5">
    <path d="M232 240 Q286 232 340 240 T448 240 T556 240 T664 240"/>
    <path d="M232 276 Q300 266 368 276 T504 276 T640 276"/>
    <path d="M232 316 Q292 306 352 316 T472 316 T592 316"/>
  </g>
  <g class="jflow2" stroke="#dff0f8" stroke-width="1.3" fill="none" opacity="0.32">
    <path d="M232 258 Q286 250 340 258 T448 258 T556 258"/>
  </g>

  <!-- 渡江的小船（横向缓慢移动，表现渡河） -->
  <g class="jcross">
    <g class="jbob">
      <path d="M244 268 q26 12 52 0 l-7 12 q-19 8 -38 0 z" fill="#2c1e16"/>
      <g fill="#15110e">
        <rect x="252" y="252" width="4.5" height="17" rx="2"/>
        <rect x="262" y="248" width="4.5" height="21" rx="2"/>
        <rect x="272" y="250" width="4.5" height="19" rx="2"/>
        <rect x="282" y="254" width="4.5" height="15" rx="2"/>
        <circle cx="254" cy="249" r="3.6"/><circle cx="264" cy="245" r="3.6"/>
        <circle cx="274" cy="247" r="3.6"/><circle cx="284" cy="251" r="3.6"/>
      </g>
      <rect x="292" y="240" width="2" height="30" fill="#4a3a2c"/>
      <path d="M294 242 l17 6 -17 6 z" fill="#c8342b"/>
    </g>
  </g>
  <ellipse cx="272" cy="286" rx="34" ry="4" fill="#0b1a22" opacity="0.5"/>

  <!-- 铁索桥：横跨画面，铁索 + 桥板 + 攀爬身影 -->
  <g>
    <!-- 主索 -->
    <path d="M232 214 Q320 250 410 208" fill="none" stroke="#7b8794" stroke-width="3"/>
    <path d="M232 232 Q320 268 410 226" fill="none" stroke="#7b8794" stroke-width="3"/>
    <path d="M232 250 Q320 286 410 244" fill="none" stroke="#7b8794" stroke-width="3"/>
    <path d="M232 268 Q320 304 410 262" fill="none" stroke="#7b8794" stroke-width="3"/>
    <!-- 桥板 -->
    <g fill="#3a2b20">
      <rect x="252" y="240" width="14" height="6" rx="1" transform="rotate(6 259 243)"/>
      <rect x="286" y="248" width="14" height="6" rx="1" transform="rotate(6 293 251)"/>
      <rect x="322" y="254" width="14" height="6" rx="1" transform="rotate(4 329 257)"/>
      <rect x="356" y="252" width="14" height="6" rx="1" transform="rotate(-3 363 255)"/>
      <rect x="386" y="246" width="14" height="6" rx="1" transform="rotate(-6 393 249)"/>
    </g>
    <!-- 攀索前进的突击队员 -->
    <g fill="#0f1216">
      <g>
        <circle cx="300" cy="228" r="5.5"/><rect x="294" y="234" width="12" height="20" rx="4"/>
        <path d="M294 240 L280 232" stroke="#0f1216" stroke-width="3" stroke-linecap="round"/>
        <path d="M306 240 L320 232" stroke="#0f1216" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g>
        <circle cx="342" cy="234" r="5.5"/><rect x="336" y="240" width="12" height="20" rx="4"/>
        <path d="M336 246 L322 238" stroke="#0f1216" stroke-width="3" stroke-linecap="round"/>
        <path d="M348 246 L362 238" stroke="#0f1216" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g>
        <circle cx="378" cy="228" r="5"/><rect x="373" y="234" width="11" height="18" rx="4"/>
      </g>
    </g>
    <!-- 桥头火光 -->
    <circle cx="410" cy="222" r="16" fill="#ff9a4a" opacity="0.35" class="glint"/>
    <circle cx="412" cy="226" r="7" fill="#ffd08a" opacity="0.6" class="glint"/>
  </g>

  <!-- 江中浪花 -->
  <g stroke="#e6f4fb" stroke-width="1.5" opacity="0.45" fill="none">
    <path d="M240 300 q14 -7 28 0"/><path d="M300 322 q14 -7 28 0"/><path d="M360 306 q14 -7 28 0"/>
  </g>
</svg>
